backend:
  - *__shared
  - *__misskey-js
  - *__misskey-reversi
  - packages/backend/**/*.{js,cjs,mjs,jsx,ts,tsx,vue,json}

sw:
  - *__shared
  - *__misskey-js
  - packages/sw/**/*.{js,cjs,mjs,jsx,ts,tsx,vue,json}

icons-subsetter: &__icons-subsetter
  - *__shared
  - packages/icons-subsetter/**/*.{js,cjs,mjs,jsx,ts,tsx,vue,json}

