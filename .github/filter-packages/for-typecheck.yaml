__shared: &__shared
  - .github/filter-packages/for-typecheck.yaml
  - .github/workflows/lint.yaml
  - .node-version
  - pnpm-lock.yaml

misskey-reversi: &__misskey-reversi
  - *__shared
  - packages/misskey-reversi/**/*.{js,cjs,mjs,jsx,ts,tsx,vue,json}

misskey-bubble-game: &__misskey-bubble-game
  - *__shared
