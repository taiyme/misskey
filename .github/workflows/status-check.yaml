name: Status Check

on:
  pull_request_target: # zizmor: ignore[dangerous-triggers]
    branches:
      - develop
      - main
    types:
      - opened
      - synchronize
      - reopened
      - edited

# zizmor: ignore[concurrency-limits]

permissions: {}

jobs:
  status-check:
    name: Status Check
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      pull-requests: read # Required for 'Watch PR checks' step.
      checks: read        # Required for 'Watch PR checks' step.
      statuses: read      # Required for 'Watch PR checks' step.
    steps:
      - name: Watch PR checks
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          pr_number: ${{ github.event.number }}
        run: |
          while true; do

            until checks_json="$( \
              gh pr checks "$pr_number" \
                --json bucket,name,workflow \
                --jq 'map(select(.name != "Status Check"))' \
            )"; do
              sleep 30
            done

            checks_state="$(\
              jq -cr '
                {
                  has_fail: any(.[]; .bucket == "fail" or .bucket == "cancel"),
                  has_pending: any(.[]; .workflow != "" and .bucket == "pending"),
                }
                | if .has_fail then "fail"
                  elif .has_pending then "pending"
                  else "done"
                  end
              ' <<< "$checks_json" \
            )"

            case "$checks_state" in
              fail)    exit 1 ;;
              done)    exit 0 ;;
              pending) sleep 15 ;;
            esac

          done
