name: Test (federation)

on:
  push:
    branches:
      - develop
      - main
    paths:
      - .github/workflows/test-federation.yaml
      - packages/backend/**/*
      - packages/mfm-js/**/*
      - packages/misskey-js/**/*

  pull_request:
    branches:
      - develop
      - main
    paths:
      - .github/workflows/test-federation.yaml
      - packages/backend/**/*
      - packages/mfm-js/**/*
      - packages/misskey-js/**/*

concurrency:
  group: >-
    ${{ github.workflow }}-
    ${{ github.event.pull_request.head.repo.full_name || github.repository }}-
    ${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions: {}

jobs:
  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard:
          - 1
          - 2
          - 3
          - 4
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
          fetch-depth: 1
          submodules: true

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0

      - name: Setup Node.js
        id: setup-node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Setup FFmpeg
        uses: ./.github/actions/setup-ffmpeg

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile

      - name: Build
        run: |
          pnpm run build

      - name: Set JEST_SHARD
        env:
          shard: ${{ matrix.shard }}/${{ strategy.job-total }}
        run: |
          JEST_SHARD="$shard"
          echo "JEST_SHARD=${JEST_SHARD}" >> "$GITHUB_ENV"

      - name: Set NODE_VERSION
        env:
          output_version: ${{ steps.setup-node.outputs.node-version }}
        run: |
          NODE_VERSION="${output_version#v}"
          echo "NODE_VERSION=${NODE_VERSION}" >> "$GITHUB_ENV"

      - name: Setup
        working-directory: packages/backend/test-federation
        run: |
          bash ./setup.sh
          sudo chmod 644 ./certificates/*.test.key

      - name: Start servers
        id: start_servers
        continue-on-error: true
        working-directory: packages/backend/test-federation
        # https://github.com/docker/compose/issues/1294#issuecomment-374847206
        run: |
          docker compose up -d --scale tester=0

      - name: Print start_servers error
        if: ${{ steps.start_servers.outcome == 'failure' }}
        working-directory: packages/backend/test-federation
        run: |
          docker compose logs | tail -n 300
          exit 1

      - name: Test
        working-directory: packages/backend/test-federation
        run: |
          docker compose run --no-deps tester

      - name: Log
        if: ${{ always() }}
        working-directory: packages/backend/test-federation
        run: |
          docker compose logs

      - name: Stop servers
        if: ${{ always() }}
        working-directory: packages/backend/test-federation
        run: |
          docker compose down
