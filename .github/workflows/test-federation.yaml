name: Test (federation)

on:
  push:
    branches:
      - taiyme
      - release
    paths:
      - .github/workflows/test-federation.yaml
      - packages/backend/**/*
      - packages/misskey-js/**/*

  pull_request_target:
    branches:
      - taiyme
      - release
    paths:
      - packages/backend/**/*
      - packages/misskey-js/**/*

permissions:
  contents: read

jobs:
  pre-checkout:
    name: Pre checkout
    uses: ./.github/workflows/pre-checkout.yaml

  e2e-testing:
    name: E2E testing
    runs-on: ubuntu-22.04
    needs:
      - pre-checkout
    strategy:
      fail-fast: false
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ needs.pre-checkout.outputs.sha }}
          fetch-depth: 1
          submodules: true

      - name: Setup pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Setup FFmpeg
        uses: federicocarboni/setup-ffmpeg@37062fbf7149fc5578d6c57e08aed62458b375d6 # v3.1

      - name: Install dependencies
        run: |
          pnpm i --frozen-lockfile

      - name: Build
        run: |
          pnpm build

      - name: Setup
        working-directory: packages/backend/test-federation
        run: |
          bash ./setup.sh
          sudo chmod 644 ./certificates/*.test.key

      - name: Start servers
        working-directory: packages/backend/test-federation
        # https://github.com/docker/compose/issues/1294#issuecomment-374847206
        run: |
          docker compose up -d --scale tester=0

      - name: Test
        working-directory: packages/backend/test-federation
        run: |
          docker compose run --no-deps tester

      - name: Stop servers
        working-directory: packages/backend/test-federation
        run: |
          docker compose down
