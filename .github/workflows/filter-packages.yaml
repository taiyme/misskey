name: Filter packages

on:
  workflow_call:
    inputs:
      filters:
        type: string
        required: true
    outputs:
      packages:
        value: ${{ jobs.filter-packages.outputs.packages }}

permissions: {}
  # contents: read
  # pull-requests: read

jobs:
  filter-packages:
    name: Filter packages
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
    outputs:
      packages: ${{ steps.result.outputs.packages }}
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Setup pnpm
        uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0
        with:
          run_install: false

      - name: Filter
        id: filter
        uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        with:
          filters: ${{ inputs.filters }}

      - name: Set actual_packages
        env:
          output_changes: ${{ steps.filter.outputs.changes }}
        run: |
          echo "actual_packages=${output_changes:-'[]'}" >> $GITHUB_ENV

      - name: Set expected_packages
        run: |
          expected_packages="$(pnpm ls -r --depth=-1 --json | jq -c 'map(.name)')"
          echo "expected_packages=${expected_packages:-'[]'}" >> $GITHUB_ENV

      - name: Extract packages
        id: result
        run: |
          packages="$( \
            jq -c -n \
            --argjson actual "${actual_packages}" \
            --argjson expected "${expected_packages}" \
            -- '$actual | map(select(. as $item | $expected | index($item)))' \
          )"
          echo "packages=${packages:-'[]'}" >> $GITHUB_OUTPUT
