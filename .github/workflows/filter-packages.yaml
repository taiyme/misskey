name: Filter packages

on:
  workflow_call:
    inputs:
      filters:
        type: string
        required: true
    outputs:
      packages:
        value: ${{ jobs.filter-packages.outputs.packages }}

# zizmor: ignore[concurrency-limits]

permissions: {}

jobs:
  filter-packages:
    name: Filter packages
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read # dorny/paths-filter の実行に必要
    outputs:
      packages: ${{ steps.result.outputs.packages }}
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
          fetch-depth: 1
          submodules: true

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile

      - name: Filter
        id: filter
        uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        with:
          filters: ${{ inputs.filters }}

      - name: Set actual_packages
        env:
          output_changes: ${{ steps.filter.outputs.changes }}
        run: |
          echo "actual_packages=${output_changes:-[]}" >> "$GITHUB_ENV"

      - name: Set expected_packages
        run: |
          expected_packages="$(pnpm ls -r --depth=-1 --json | jq -c 'map(.name)')"
          echo "expected_packages=${expected_packages:-[]}" >> "$GITHUB_ENV"

      - name: Extract packages
        id: result
        run: |
          packages="$( \
            jq -c -n \
            --argjson actual "$actual_packages" \
            --argjson expected "$expected_packages" \
            -- '$actual | map(select(. as $item | $expected | index($item)))' \
          )"
          echo "packages=${packages:-[]}" >> "$GITHUB_OUTPUT"
