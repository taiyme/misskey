name: Lint

on:
  push:
    branches:
      - develop
      - main

  pull_request_target:
    branches:
      - develop
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions: {}
  # contents: read
  # pull-requests: read

jobs:
  pre-checkout:
    name: Pre checkout
    uses: ./.github/workflows/pre-checkout.yaml
    permissions:
      contents: read

  filter-packages-eslint:
    name: Filter packages (ESLint)
    uses: ./.github/workflows/filter-packages.yaml
    permissions:
      contents: read
      pull-requests: read
    with:
      filters: .github/filter-packages/for-eslint.yaml

  filter-packages-typecheck:
    name: Filter packages (TypeCheck)
    uses: ./.github/workflows/filter-packages.yaml
    permissions:
      contents: read
      pull-requests: read
    with:
      filters: .github/filter-packages/for-typecheck.yaml

  eslint:
    name: ESLint
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    needs:
      - pre-checkout
      - filter-packages-eslint
    if: ${{ needs.filter-packages-eslint.outputs.packages != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.filter-packages-eslint.outputs.packages) }}
    env:
      eslint-cache-version: v1
      eslint-cache-path: ${{ github.workspace }}/node_modules/.cache/eslint-${{ matrix.package }}
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
          ref: ${{ needs.pre-checkout.outputs.sha }}
          fetch-depth: 1
          submodules: true

      - name: Setup pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile

      - name: Restore eslint cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ env.eslint-cache-path }}
          key: eslint-${{ env.eslint-cache-version }}-${{ matrix.package }}-${{ hashFiles('**/pnpm-lock.yaml') }}-${{ needs.pre-checkout.outputs.sha }}
          restore-keys: eslint-${{ env.eslint-cache-version }}-${{ matrix.package }}-${{ hashFiles('**/pnpm-lock.yaml') }}-

      - name: Run eslint
        run: |
          pnpm --filter='${{ matrix.package }}' \
            run eslint \
            --cache \
            --cache-location='${{ env.eslint-cache-path }}' \
            --cache-strategy=content

  typecheck:
    name: TypeCheck
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    needs:
      - pre-checkout
      - filter-packages-typecheck
    if: ${{ needs.filter-packages-typecheck.outputs.packages != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.filter-packages-typecheck.outputs.packages) }}
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
          ref: ${{ needs.pre-checkout.outputs.sha }}
          fetch-depth: 1
          submodules: true

      - name: Setup pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile

      - name: Build dependencies
        run: |
          pnpm --filter='${{ matrix.package }}...' --filter='!${{ matrix.package }}' \
            run build

      - name: Run typecheck
        run: |
          pnpm --filter='${{ matrix.package }}' \
            run typecheck
